name: Build GKI 5.10 Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: yhys233/android_gki_kernel_5.10_common
          ref: android12-5.10-2026-04_r1
          path: kernel
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install --no-install-recommends -y \
            binutils git make bc bison openssl curl zip kmod cpio flex \
            libelf-dev libssl-dev libc6-dev device-tree-compiler \
            ca-certificates python3 xz-utils aria2 build-essential ccache pigz \
            parallel jq wget

      - name: Download AOSP Clang r416183b
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          if curl -L --fail --silent --show-error \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz \
            | tar -xz --warning=no-unknown-keyword; then
            echo ">>> ✅ curl 下载成功"
          else
            wget -qO- https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz \
              | tar -xz --warning=no-unknown-keyword
            echo ">>> ✅ wget 下载成功"
          fi

      - name: Build Kernel (纯 Clang + LLD)
        run: |
          export PATH="$HOME/clang/bin:$PATH"

          echo "=== 当前 PATH ==="
          echo $PATH

          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          make clean && make mrproper
          rm -rf out && mkdir -p out

          make CC="ccache clang" -j$(nproc) O=out gki_defconfig
          make CC="ccache clang" -j$(nproc) O=out olddefconfig prepare

          make CC="ccache clang" -j$(nproc) O=out 2>&1 | tee ../build.log

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
