name: Build GKI 5.10 手动构建

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: yhys233/android_gki_kernel_5.10_common
          ref: android12-5.10-2026-04_r1
          path: kernel
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install --no-install-recommends -y \
            binutils git make bc bison openssl curl zip kmod cpio flex \
            libelf-dev libssl-dev libtfm-dev libc6-dev device-tree-compiler \
            ca-certificates python3 xz-utils aria2 build-essential ccache pigz \
            parallel jq opam libpcre3-dev wget

      - name: Download AOSP Clang r416183b
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          if curl -L --fail --silent --show-error \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz \
            | tar -xz --warning=no-unknown-keyword; then
            echo ">>> ✅ curl 下载成功"
          else
            wget -qO- https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz \
              | tar -xz --warning=no-unknown-keyword
            echo ">>> ✅ wget 下载成功"
          fi

      - name: Download AOSP GCC 4.9
        run: |
          git clone --depth=1 -b android12-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 $HOME/gcc-64
          git clone --depth=1 -b android12-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 $HOME/gcc-32

      - name: Build Kernel
        run: |
          # 正确追加工具链路径（不要覆盖整个 PATH）
          export PATH="$HOME/clang/bin:$HOME/gcc-64/bin:$HOME/gcc-32/bin:$PATH"

          echo "=== 当前 PATH ==="
          echo $PATH

          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make clean && make mrproper
          rm -rf out && mkdir -p out

          make CC="ccache clang" -j$(nproc) O=out gki_diting_defconfig

          make CC="ccache clang" -j$(nproc) O=out \
            CONFIG_TRIM_UNUSED_KSYMS=y \
            UNUSED_KSYMS_WHITELIST=arch/arm64/configs/abi_symbollist.raw \
            olddefconfig prepare

          make CC="ccache clang" -j$(nproc) O=out 2>&1 | tee ../build.log

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Strip Image
        run: |
          $HOME/clang/bin/llvm-strip --strip-all kernel/out/arch/arm64/boot/Image

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3 && rm -rf .git README.md LICENSE && zip -r9 ../GKI5.10-diting-stripped.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-${{ github.run_number }}
          name: GKI 5.10 Custom Build
          files: |
            GKI5.10-diting-stripped.zip
            build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
