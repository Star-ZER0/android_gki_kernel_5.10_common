name: Build GKI 5.10 (Fully Custom + Strip)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: yhys233/android_gki_kernel_5.10_common
          ref: android12-5.10-2026-04_r1
          path: kernel
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            binutils git make bc bison openssl curl zip kmod cpio flex \
            libelf-dev libssl-dev libtfm-dev libc6-dev device-tree-compiler \
            ca-certificates python3 xz-utils aria2 build-essential ccache pigz \
            parallel jq opam libpcre3-dev wget

      - name: Download AOSP Clang r416183b (curl + wget fallback)
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang

          echo ">>> 尝试使用 curl 下载 clang-r416183b..."
          if curl -L --fail --silent --show-error \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz \
            | tar -xz --warning=no-unknown-keyword; then
            echo ">>> ✅ curl 下载并解压成功"
          else
            echo ">>> ❌ curl 失败，尝试使用 wget..."
            wget -qO- \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz \
              | tar -xz --warning=no-unknown-keyword
            echo ">>> ✅ wget 下载并解压完成"
          fi

      - name: Download AOSP GCC 4.9
        run: |
          git clone --depth=1 -b android12-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 $HOME/gcc-64
          git clone --depth=1 -b android12-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 $HOME/gcc-32

      - name: Build Kernel
        env:
          PATH: $HOME/clang/bin:$HOME/gcc-64/bin:$HOME/gcc-32/bin:$PATH
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make clean && make mrproper
          rm -rf out && mkdir -p out

          make CC="ccache clang" -j$(nproc) O=out gki_diting_defconfig
          make CC="ccache clang" -j$(nproc) O=out \
            CONFIG_TRIM_UNUSED_KSYMS=y \
            UNUSED_KSYMS_WHITELIST=arch/arm64/configs/abi_symbollist.raw \
            olddefconfig prepare

          make CC="ccache clang" -j$(nproc) O=out

      - name: Strip Image
        run: |
          IMAGE="kernel/out/arch/arm64/boot/Image"
          echo "=== Before strip ==="
          ls -lh "$IMAGE"

          $HOME/clang/bin/llvm-strip --strip-all "$IMAGE"

          echo "=== After strip ==="
          ls -lh "$IMAGE"

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          rm -rf .git README.md LICENSE
          zip -r9 ../GKI5.10-diting-stripped.zip .

          echo "=== Final zip size ==="
          ls -lh ../GKI5.10-diting-stripped.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-${{ github.run_number }}
          name: GKI 5.10 Custom Build (Stripped)
          files: GKI5.10-diting-stripped.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}