name: Google AOSP Toolchain Build GKI5.10
on:
  workflow_dispatch: # 页面手动启动，方便调试
  push:
    branches:
      - main
      - master
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取你的GKI内核源码
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. 预装基础编译依赖
      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install git make ccache zip unzip bc libssl-dev

      # 3. 拉取Google官方原生Clang r416183b
      - name: Download AOSP Official Clang
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-r416183b
          cd clang-r416183b
          git checkout clang-r416183b

      # 4. 拉取Google官方aarch64 GCC 4.9
      - name: Download AOSP aarch64 GCC4.9
        run: git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-aarch64

      # 5. 拉取Google官方arm32 GCC 4.9
      - name: Download AOSP arm GCC4.9
        run: git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc-arm

      # 6. 拉取AnyKernel3用于打包
      - name: Clone AnyKernel3
        run: git clone https://github.com/osm0sis AnyKernel3

      # 7. 编译环境变量（完全对齐AOSP原生PATH）
      - name: Build Kernel (Official Toolchain)
        env:
          ARCH: arm64
          SUBARCH: arm64
          KD: gki_defconfig
          PATH: ${{ github.workspace }}/clang-r416183b/bin:${{ github.workspace }}/gcc-aarch64/bin:${{ github.workspace }}/gcc-arm/bin:$PATH
        run: |
          args="-j$(nproc) ARCH=arm64 SUBARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          # 官方标准全清理，彻底清除旧缓存污染
          make clean && make mrproper
          rm -rf out && mkdir -p out
          # 加载defconfig + 同步裁剪配置 + 刷新头文件
          make CC="ccache clang" $args $KD
          make CC="ccache clang" $args olddefconfig
          make CC="ccache clang" $args prepare
          # 完整编译并输出日志
          make CC="ccache clang" $args 2>&1 | tee kernel_build.log

      # 8. 复制镜像+精简AK3打包文件
      - name: Package & Slim AnyKernel Zip
        run: |
          cp out/arch/arm64/boot/Image AnyKernel/
          cd AnyKernel
          # 删除无用静态工具、占位模块、空目录瘦身
          rm -rf tools/lptools_static tools/htools_static modules/system/lib/placeholder patch ramdisk
          # AOSP原生最高压缩打包
          zip -r -9 kernel-$(git rev-parse --short HEAD).zip .

      # 9. 上传刷机包+完整编译日志
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GKI5.10-OfficialBuild-${{ github.sha }}
          path: |
            AnyKernel/*.zip
            kernel_build.log
