name: Build GKI 5.10 Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean build cache and generated files
        run: |
          echo "Cleaning previous build artifacts..."
          if [ -d "kernel/kernel" ]; then
            cd kernel/kernel
            make mrproper 2>/dev/null || true
            make clean 2>/dev/null || true
            rm -rf .config
            rm -rf .version
            rm -rf include/generated/autoksyms.h
            rm -rf include/generated/autoconf.h
            rm -rf include/config/
            rm -rf .tmp_versions
            echo "Build cache cleaned successfully"
            cd ../..
          fi

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/yhys233/android_gki_kernel_5.10_common
          kernel-branch: android12-5.10-2026-04_r1
          config: gki_diting_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r416183b
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
          
      # ========== 自动生成 abi_symbollist.raw ==========
      - name: Generate abi_symbollist.raw
        run: |
          cd kernel/kernel
          OUT=out

          echo "Generating abi_symbollist.raw from built vmlinux..."
          nm -S "${OUT}/vmlinux" 2>/dev/null | grep ' T ' | awk '{print $3}' | sort -u > "${OUT}/abi_symbollist.raw" || true

          echo "Generated $(wc -l < ${OUT}/abi_symbollist.raw) symbols"
          ls -lh ${OUT}/abi_symbollist.raw

      - name: Upload generated abi_symbollist.raw
        uses: actions/upload-artifact@v4
        with:
          name: abi_symbollist-generated
          path: kernel/kernel/out/abi_symbollist.raw
          retention-days: 7

      - name: Upload full out directory (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out-full-${{ github.sha }}
          path: kernel/kernel/out/
          retention-days: 3
          # 注意：out 目录比较大，上传会比较慢
