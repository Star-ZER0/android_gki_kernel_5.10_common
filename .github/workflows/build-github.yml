name: Build GKI 5.10 Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bc bison flex libssl-dev ccache zip unzip libncurses5 libtinfo5

      - name: Setup Toolchains
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
          
          chmod -R +x clang/bin gcc64/bin gcc32/bin

      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3

      - name: Build Kernel
        run: |
          export PATH="\( (pwd)/clang/bin: \)(pwd)/gcc64/bin:$(pwd)/gcc32/bin:/usr/bin:$PATH"
          echo "=== Toolchain Debug ==="
          ls -l gcc64/bin/*ld* || true
          
          make clean && rm -rf out && mkdir out
          
          ARGS="-j$(nproc) ARCH=arm64 O=out \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=aarch64-linux-android-ld"
          
          make CC=clang $ARGS gki_defconfig
          make CC=clang $ARGS olddefconfig
          make CC=clang \( ARGS -j \)(nproc) 2>&1 | tee build.log
        shell: bash

      - name: Package
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb ak3/ 2>/dev/null || cp out/arch/arm64/boot/Image ak3/
          cd ak3 && zip -r9 kernel.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: Kernel-GKI5.10
          path: ak3/*.zip
