name: GitHub Lineage Mirror Build GKI5.10

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  compile:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git make ccache zip unzip bc \
            libssl-dev coreutils libncurses5 libtinfo5
        shell: bash

      - name: Download Clang r416183b (Lineage GitHub Mirror)
        run: git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang-r416183b

      - name: Download aarch64 GCC4.9 (Lineage GitHub Mirror)
        run: git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc-aarch64

      - name: Download arm GCC4.9 (Lineage GitHub Mirror)
        run: git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc-arm

      - name: Clone AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3

      - name: Build Kernel (Lineage Mirror Toolchain)
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          echo "=== PATH Debug ==="
          export PATH="\( {{ github.workspace }}/clang-r416183b/bin: \){{ github.workspace }}/gcc-aarch64/bin:${{ github.workspace }}/gcc-arm/bin:/usr/bin:/usr/sbin:/bin:$PATH"
          echo $PATH
          which make || echo "make not found!"
          which clang || echo "clang not found!"

          ARGS="-j$(nproc) ARCH=arm64 SUBARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu-"

          make clean || true
          make mrproper || true
          rm -rf out && mkdir -p out

          make CC="ccache clang" $ARGS gki_defconfig
          make CC="ccache clang" $ARGS olddefconfig
          make CC="ccache clang" $ARGS prepare
          make CC="ccache clang" $ARGS 2>&1 | tee kernel_build.log
        shell: bash

      - name: Package & Slim AnyKernel Zip
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ak3/
            cd ak3
            rm -rf tools/lptools_static tools/htools_static modules/system/lib/placeholder patch ramdisk
            zip -r -9 kernel-$(git rev-parse --short HEAD).zip .
            echo "Kernel zip packaged successfully."
          else
            echo "Error: Image not found! Build failed."
            exit 1
          fi
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GKI5.10-GitHubMirror-${{ github.sha }}
          path: |
            ak3/*.zip
            kernel_build.log
